[package]
name = "widdgyy"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "A GPU-accelerated desktop ricing engine for Wayland"
license = "GPL-3.0-or-later"

[[bin]]
name = "widdgyy"
path = "src/main.rs"

[lib]
name = "widdgyy"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
calloop = "0.14"
calloop-wayland-source = "0.4"
chrono = "0.4"
cosmic-text = { version = "0.19", default-features = false, features = ["std", "fontconfig", "swash", "peniko"] }
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
json5 = "1.3"
log = "0.4"
notify = "8.2"
pollster = "0.4"
raw-window-handle = "0.6"
serde_json = "1.0"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
ureq = "3.5"
vello = "0.11"
wayland-client = { version = "0.31", features = ["system"] }
wgpu = "30.0"

[features]
default = ["video"]
video = ["dep:gstreamer", "dep:gstreamer-video", "dep:gstreamer-app"]

[dependencies.gstreamer]
version = "0.25"
optional = true

[dependencies.gstreamer-video]
version = "0.25"
optional = true

[dependencies.gstreamer-app]
version = "0.25"
optional = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
