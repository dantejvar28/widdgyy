<!doctype html>
<html><head><meta charset="utf-8"><style>
html, body { margin: 0; background: #e8e8e8; }
.root {
  display: grid;
  width: 300px;
  height: 100px;
  background: #fff;
  grid-template-columns: repeat(3, 100px);
  grid-template-rows: 50px 50px;
  grid-template-areas:
    "header header side"
    "main   main   side";
}
.header { grid-area: header; background: #333; }
.side { grid-area: side; background: #999; }
.main { grid-area: main; background: #ccc; }
</style></head><body>
<div class="root" data-test="root">
  <div class="header" data-test="header"></div>
  <div class="side" data-test="side"></div>
  <div class="main" data-test="main"></div>
</div>
</body></html>
