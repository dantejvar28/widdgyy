<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; padding: 0; background: #e8e8e8; }
.root { position: relative; width: 600px; height: 300px; background: #fff; }
.title {
  position: absolute; left: 40px; top: 20px; width: 300px; height: 40px;
  font-family: "DejaVu Sans"; font-size: 32px; line-height: 40px;
}
.wrap {
  position: absolute; left: 40px; top: 90px; width: 160px;
  font-family: "DejaVu Sans"; font-size: 16px; line-height: 20px;
}
.spaced {
  position: absolute; left: 240px; top: 90px; width: 300px;
  font-family: "DejaVu Sans"; font-size: 18px; line-height: 24px;
  letter-spacing: 2px; word-spacing: 5px;
}
.right {
  position: absolute; left: 240px; top: 160px; width: 300px;
  font-family: "DejaVu Sans"; font-size: 20px; line-height: 26px;
  text-align: right;
}
</style>
</head>
<body>
<div class="root" data-test="root">
  <div class="title" data-test="title" data-lines="title">Hello Widdgyy</div>
  <div class="wrap" data-test="wrap" data-lines="wrap">The quick brown fox jumps over the lazy dog and keeps running for a while</div>
  <div class="spaced" data-test="spaced" data-lines="spaced">SPACED TEXT</div>
  <div class="right" data-test="right" data-lines="right">Right aligned line</div>
</div>
</body>
</html>
