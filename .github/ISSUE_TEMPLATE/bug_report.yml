name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: Clear and short bug description
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact steps to trigger the issue
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Linux distro / session
      placeholder: Arch Linux, Hyprland
    validations:
      required: true

  - type: input
    id: rust
    attributes:
      label: Rust / Widdgyy version
      placeholder: rustc 1.99.1, widdgyy 0.2.0
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU / driver
      placeholder: AMD Radeon ..., Mesa 25.x / NVIDIA 5xx
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Renderer issue area
      options:
        - Text / fonts
        - Layout (flex/grid)
        - Background / border / shadows
        - Image / GIF
        - Video (GStreamer)
        - API sticker
        - Hot reload
        - Wayland layer shell
        - Other

  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      render: shell
